<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Predictive Public Complaint Intelligence and Hotspot Detection System">
    <title>ComplaintIQ - Smart Civic Intelligence</title>
    
    <!-- Existing global styles for consistency if needed, but we'll mostly use Tailwind -->
    <link rel="stylesheet" href="/css/styles.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        'primary-dark': '#4338ca',
                        'primary-light': '#818cf8',
                        accent: '#06b6d4',
                        dark: {
                            900: '#020617',
                            800: '#0F172A',
                            700: '#1E293B',
                            600: '#334155'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>

        body { margin: 0; transition: background-color 0.3s, color 0.3s; }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        .dark .glass-card:hover {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #topbar { display: none !important; }

    </style>
</head>
<body class="bg-slate-50 dark:bg-dark-900 text-slate-900 dark:text-slate-50 antialiased font-sans">
    
    <!-- React Root -->
    <div id="root"></div>

    <!-- Legacy topbar target to prevent app.js errors -->
    <div id="topbar" style="display:none;"></div>

    <!-- We need to include app.js for authentication logic (getUser) -->
    <script src="/js/app.js"></script>

    <!-- React Application Code -->
    <script type="text/babel">
        // --- Lucide Icons (Inlined as standard React components for standalone Babel) ---
        const IconWrapper = ({ children, className = "", size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const Shield = (p) => <IconWrapper {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></IconWrapper>;
        const BrainCircuit = (p) => <IconWrapper {...p}><path d="M12 4.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-1.98 3 2.5 2.5 0 0 0-1.32 4.24 3 3 0 0 0 .34 5.58 2.5 2.5 0 0 0 2.96 3.08 2.5 2.5 0 0 0 4.91.05L12 20V4.5Z"/><path d="M16 8V5c0-1.1.9-2 2-2"/><path d="M12 13h4"/><path d="M12 17h6"/><path d="M19 13v-2l-1.64-1.64"/><path d="M22 13v-2l-1.64-1.64"/></IconWrapper>;
        const MapIcon = (p) => <IconWrapper {...p}><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></IconWrapper>;
        const Activity = (p) => <IconWrapper {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></IconWrapper>;
        const Clock = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconWrapper>;
        const Users = (p) => <IconWrapper {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>;
                const FileText = (p) => <IconWrapper {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></IconWrapper>;
        const Sun = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></IconWrapper>;
        const Moon = (p) => <IconWrapper {...p}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></IconWrapper>;
        const CheckCircle = (p) => <IconWrapper {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconWrapper>;
        const ArrowRight = (p) => <IconWrapper {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></IconWrapper>;
        const BarChart3 = (p) => <IconWrapper {...p}><path d="M3 3v18h18"/><rect width="4" height="7" x="7" y="10" rx="1"/><rect width="4" height="12" x="15" y="5" rx="1"/></IconWrapper>;
        const Layers = (p) => <IconWrapper {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></IconWrapper>;

        const { useState, useEffect } = React;

                const App = () => {
            const [user, setUser] = useState(null);
            const [isDark, setIsDark] = useState(true);

            useEffect(() => {
                if (typeof window.getUser === 'function') {
                    setUser(window.getUser());
                }
                
                const checkTheme = () => {
                    setIsDark(document.documentElement.classList.contains('dark'));
                };
                
                checkTheme(); // Initial check
                window.addEventListener('themeChanged', checkTheme);
                return () => window.removeEventListener('themeChanged', checkTheme);
            }, []);

            const getPrimaryLink = () => {
                if (!user) return { href: '/register.html', text: 'Register Complaint' };
                if (user.role === 'citizen') return { href: '/complaint-form.html', text: 'File a Complaint' };
                if (user.role === 'admin') return { href: '/admin-dashboard.html', text: 'Admin Dashboard' };
                if (user.role === 'department') return { href: '/dept-dashboard.html', text: 'Department Dashboard' };
                return { href: '/register.html', text: 'Register Complaint' };
            };

            const getSecondaryLink = () => {
                if (!user) return { href: '/login.html', text: 'Track Complaint', show: true };
                if (user.role === 'citizen') return { href: '/my-complaints.html', text: 'Track Complaints', show: true };
                if (user.role === 'admin') return { href: '/hotspots.html', text: 'View Hotspots', show: true };
                return { show: false };
            };

            const primaryLink = getPrimaryLink();
            const secondaryLink = getSecondaryLink();

            return (

                        <div className="absolute top-[20%] right-[-10%] w-96 h-96 bg-cyan-500/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob" style={{animationDelay: '2s'}}></div>
                        <div className="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-indigo-500/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob" style={{animationDelay: '4s'}}></div>
                    </div>

                                        Register
                                    </a>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="relative z-10">
                        {/* SECTION 1 - HERO */}

                            <div className="lg:grid lg:grid-cols-12 lg:gap-16 items-center">
                                <div className="lg:col-span-6 text-center lg:text-left">
                                    <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-card mb-8">
                                        <span className="flex h-2 w-2 rounded-full bg-accent animate-pulse"></span>
                                        <span className="text-sm font-medium text-slate-600 dark:text-slate-300">Predictive Intelligence Platform v2.0</span>
                                    </div>
                                    <h1 className="text-5xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-6 leading-[1.1]">
                                        Smart Civic <br />
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-primary-light via-indigo-400 to-cyan-400">
                                            Complaint Management
                                        </span>
                                    </h1>
                                    <p className="text-lg sm:text-xl text-slate-500 dark:text-slate-400 mb-10 max-w-2xl mx-auto lg:mx-0 leading-relaxed">
                                        Empowering citizens to report public issues while leveraging AI to detect recurring problem areas, track department performance, and predict future hotspots in real-time.
                                    </p>
                                    <div className="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                                        <a href={primaryLink.href} className="inline-flex items-center justify-center gap-2 px-8 py-4 text-base font-semibold text-slate-900 dark:text-white bg-primary hover:bg-primary-dark rounded-xl transition-all duration-300 shadow-[0_0_20px_rgba(79,70,229,0.4)] hover:shadow-[0_0_30px_rgba(79,70,229,0.6)] hover:-translate-y-1">
                                            {primaryLink.text}
                                            <ArrowRight size={20} />
                                        </a>
                                        {secondaryLink.show && (
                                            <a href={secondaryLink.href} className="inline-flex items-center justify-center gap-2 px-8 py-4 text-base font-semibold text-slate-700 dark:text-slate-200 glass-card rounded-xl transition-all duration-300 hover:text-slate-900 dark:text-white hover:-translate-y-1">
                                                {secondaryLink.text}
                                            </a>
                                        )}
                                    </div>
                                </div>
                                <div className="lg:col-span-6 mt-16 lg:mt-0 relative hidden md:block">
                                    {/* Dashboard Mockup Abstract */}
                                    <div className="relative rounded-2xl glass-card border border-black/10 dark:border-white/10 p-2 overflow-hidden shadow-2xl">
                                        <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-white/5 to-transparent pointer-events-none"></div>
                                        <div className="bg-slate-50 dark:bg-dark-900 rounded-xl overflow-hidden border border-black/5 dark:border-white/5">
                                            {/* Mock Header */}
                                            <div className="h-12 border-b border-black/5 dark:border-white/5 flex items-center px-4 gap-2">
                                                <div className="w-3 h-3 rounded-full bg-red-500/80"></div>
                                                <div className="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                                                <div className="w-3 h-3 rounded-full bg-green-500/80"></div>
                                            </div>
                                            {/* Mock Content */}
                                            <div className="p-6">
                                                <div className="flex gap-4 mb-6">
                                                    <div className="flex-1 h-24 bg-black/5 dark:bg-white/5 rounded-lg border border-black/5 dark:border-white/5 p-4 flex flex-col justify-between">
                                                        <div className="w-8 h-8 rounded bg-primary/20 flex items-center justify-center"><Activity className="text-primary-light" size={16}/></div>
                                                        <div className="h-4 w-16 bg-white/10 rounded"></div>
                                                    </div>
                                                    <div className="flex-1 h-24 bg-black/5 dark:bg-white/5 rounded-lg border border-black/5 dark:border-white/5 p-4 flex flex-col justify-between">
                                                        <div className="w-8 h-8 rounded bg-accent/20 flex items-center justify-center"><MapIcon className="text-accent" size={16}/></div>
                                                        <div className="h-4 w-12 bg-white/10 rounded"></div>
                                                    </div>
                                                </div>
                                                <div className="h-40 bg-black/5 dark:bg-white/5 rounded-lg border border-black/5 dark:border-white/5 relative overflow-hidden flex items-end px-4 gap-2 pb-4">
                                                    {/* Mock Chart Bars */}
                                                    {[40, 70, 45, 90, 65, 80, 55].map((h, i) => (
                                                        <div key={i} className="flex-1 bg-gradient-to-t from-primary/80 to-primary-light/20 rounded-t-sm" style={{height: `${h}%`}}></div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* Floating Badges */}
                                    <div className="absolute -bottom-6 -left-6 glass-card p-4 rounded-xl flex items-center gap-4 shadow-xl animate-[bounce_6s_infinite]">
                                        <div className="w-12 h-12 rounded-full bg-green-500/20 flex items-center justify-center">
                                            <CheckCircle className="text-green-400" size={24} />
                                        </div>
                                        <div>
                                            <div className="text-xs text-slate-500 dark:text-slate-400 font-medium">Resolution Rate</div>
                                            <div className="text-xl font-bold text-slate-900 dark:text-white">94.2%</div>
                                        </div>
                                    </div>
                                    <div className="absolute -top-6 -right-6 glass-card p-4 rounded-xl flex items-center gap-4 shadow-xl animate-[bounce_7s_infinite_reverse]">
                                        <div className="w-12 h-12 rounded-full bg-accent/20 flex items-center justify-center">
                                            <BrainCircuit className="text-accent" size={24} />
                                        </div>
                                        <div>
                                            <div className="text-xs text-slate-500 dark:text-slate-400 font-medium">AI Detection</div>
                                            <div className="text-xl font-bold text-slate-900 dark:text-white">Active</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* SECTION 2 - STATS ROW */}
                        <section className="py-12 border-y border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02]">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-8 lg:gap-12 text-center">
                                    {[
                                        { label: 'Areas Covered', value: '12+', icon: MapIcon, color: 'text-blue-400' },
                                        { label: 'Departments', value: '6', icon: Users, color: 'text-indigo-400' },
                                        { label: 'Total Complaints', value: '12.5k', icon: FileText, color: 'text-green-400' },
                                        { label: 'Avg Resolution Time', value: '< 48h', icon: Clock, color: 'text-accent' }
                                    ].map((stat, i) => (
                                        <div key={i} className="flex flex-col items-center">
                                            <stat.icon className={`mb-3 ${stat.color}`} size={32} strokeWidth={1.5} />
                                            <div className="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white mb-2">{stat.value}</div>
                                            <div className="text-sm font-medium text-slate-500 dark:text-slate-400">{stat.label}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* SECTION 3 - FEATURES GRID (Replaces "How It Works") */}
                        <section className="py-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
                            <div className="text-center mb-16 max-w-3xl mx-auto">
                                <h2 className="text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white mb-6">
                                    Next-Generation <span className="text-transparent bg-clip-text bg-gradient-to-r from-primary-light to-accent">Civic Operations</span>
                                </h2>
                                <p className="text-slate-500 dark:text-slate-400 text-lg">
                                    A streamlined platform replacing fragmented systems with a unified, intelligent dashboard for citizens and administrators.
                                </p>
                            </div>

                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {[
                                    { title: 'Register Complaints', desc: 'Citizens seamlessly report issues with category auto-routing and priority assignment.', icon: FileText, color: 'from-blue-500/20 to-blue-500/0', text: 'text-blue-400' },
                                    { title: 'Smart AI Detection', desc: 'Predictive algorithms identify recurring problem zones before they escalate.', icon: BrainCircuit, color: 'from-indigo-500/20 to-indigo-500/0', text: 'text-indigo-400' },
                                    { title: 'Real-Time Tracking', desc: 'End-to-end transparency. Track complaint status from submission to resolution.', icon: Activity, color: 'from-green-500/20 to-green-500/0', text: 'text-green-400' },
                                    { title: 'Analytics & Hotspots', desc: 'Visual heatmaps and performance dashboards for municipal departments.', icon: BarChart3, color: 'from-accent/20 to-accent/0', text: 'text-accent' }
                                ].map((feat, i) => (
                                    <div key={i} className="glass-card rounded-2xl p-8 group transition-all duration-300 hover:-translate-y-2 h-full flex flex-col">
                                        <div className={`w-14 h-14 rounded-xl bg-gradient-to-br ${feat.color} flex items-center justify-center mb-6 border border-black/5 dark:border-white/5 group-hover:scale-110 transition-transform duration-300`}>
                                            <feat.icon className={feat.text} size={28} />
                                        </div>
                                        <h3 className="text-xl font-bold text-slate-900 dark:text-white mb-3">{feat.title}</h3>
                                        <p className="text-slate-500 dark:text-slate-400 leading-relaxed flex-1">{feat.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* SECTION 4 - DASHBOARD PREVIEW */}
                        <section className="py-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-t border-black/5 dark:border-white/5 relative">
                            {/* Subtle sophisticated background instead of neon glow */}
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-3xl h-[600px] bg-[radial-gradient(ellipse_at_top,rgba(79,70,229,0.12),transparent_50%)] pointer-events-none"></div>
                            
                            <div className="text-center mb-16 relative z-10">
                                <h2 className="text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white mb-4 tracking-tight">
                                    Designed for <span className="text-transparent bg-clip-text bg-gradient-to-r from-slate-200 to-slate-500">Scale</span>
                                </h2>
                                <p className="text-slate-500 dark:text-slate-400 text-lg max-w-2xl mx-auto font-light">
                                    Production-ready analytics dashboards for municipal officers to monitor city health, track resolutions, and predict hotspots in real-time.
                                </p>
                            </div>

                            {/* Realistic Dashboard Mockup */}
                            <div className="relative rounded-xl border border-black/10 dark:border-white/10 bg-white dark:bg-[#0A0A0A] overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.4)] mx-auto max-w-6xl z-10 ring-1 ring-white/5">
                                {/* Window Chrome */}
                                <div className="h-12 bg-slate-50 dark:bg-[#0F0F0F] border-b border-black/5 dark:border-white/5 flex items-center px-4 gap-2">

                                        <div className="w-3 h-3 rounded-full bg-[#FF5F56] border border-black/10 dark:border-white/10"></div>
                                        <div className="w-3 h-3 rounded-full bg-[#FFBD2E] border border-black/10 dark:border-white/10"></div>
                                        <div className="w-3 h-3 rounded-full bg-[#27C93F] border border-black/10 dark:border-white/10"></div>

                                        <Shield size={12} />

                                </div>

                                <div className="flex h-[700px]">
